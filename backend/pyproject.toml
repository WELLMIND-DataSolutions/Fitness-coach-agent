[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "B008"]  # asserts in tests; FastAPI Depends() in defaults

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S107"]

[tool.pytest.ini_options]
testpaths = ["tests"]