<svg width="1600" height="730" viewBox="0 0 1600 730" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest">
<title>FitCoach system architecture diagram</title>
<desc>Client web app talks to a FastAPI backend, which routes messages to the FitCoach agent orchestrator. The orchestrator calls the Groq LLM API and business-logic tools, which read and write a SQLite database. A background reminder scheduler independently polls and writes to the same database.</desc>

<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M1 1L9 5L1 9Z" fill="#5b6472"/>
</marker>
</defs>

<rect x="0" y="0" width="1600" height="730" fill="#ffffff"/>

<text x="800" y="36" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="600" fill="#1a2332">FitCoach â€” System Architecture</text>
<text x="800" y="58" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5b6472">AI fitness &amp; nutrition coaching platform â€” tool-calling agent architecture</text>

<!-- ===================== LLM external box ===================== -->
<g font-family="Arial, Helvetica, sans-serif">
<rect x="640" y="70" width="260" height="130" rx="12" fill="#f5f5f3" stroke="#8a8d93" stroke-width="1.6" stroke-dasharray="7 5"/>
<g transform="translate(658,84)" stroke="#3a3d42" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
