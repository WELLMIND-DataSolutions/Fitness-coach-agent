<text x="98" y="302" font-size="12" fill="#3c556e">React + Vite SPA</text>
<line x1="58" y1="316" x2="262" y2="316" stroke="#2f6fb0" stroke-width="1" opacity="0.35"/>
<text x="66" y="340" font-size="11.5" fill="#3c556e">â€¢ Login &amp; registration UI</text>
<text x="66" y="362" font-size="11.5" fill="#3c556e">â€¢ Real-time chat interface</text>
<text x="66" y="384" font-size="11.5" fill="#3c556e">â€¢ Markdown rendering (tables, lists)</text>
<text x="66" y="406" font-size="11.5" fill="#3c556e">â€¢ JWT stored client-side</text>
</g>

<!-- API Gateway -->
<g font-family="Arial, Helvetica, sans-serif">
<rect x="340" y="250" width="260" height="210" rx="12" fill="#e7f6f1" stroke="#12886a" stroke-width="1.6"/>
