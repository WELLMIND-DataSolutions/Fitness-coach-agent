<!-- Client -->
<g font-family="Arial, Helvetica, sans-serif">
<rect x="40" y="250" width="240" height="210" rx="12" fill="#eaf2fb" stroke="#2f6fb0" stroke-width="1.6"/>
<g transform="translate(58,264)" stroke="#123a5c" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
<rect x="1" y="1" width="26" height="18" rx="2"/>
