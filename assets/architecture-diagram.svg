</g>
<text x="700" y="104" font-size="16" font-weight="600" fill="#3a3d42">Groq LLM API</text>
<text x="700" y="122" font-size="12" fill="#5b6472">External inference service</text>
<line x1="658" y1="136" x2="882" y2="136" stroke="#8a8d93" stroke-width="1" opacity="0.4"/>
<text x="666" y="156" font-size="11.5" fill="#5b6472">â€¢ OpenAI-compatible endpoint Â· gpt-oss-120b</text>
<text x="666" y="178" font-size="11.5" fill="#5b6472">â€¢ Function / tool calling, streamed replies</text>
</g>

<!-- vertical connector: LLM <-> Agent -->
<line x1="770" y1="200" x2="770" y2="250" stroke="#5b6472" stroke-width="1.8" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text x="790" y="222" font-size="11.5" fill="#5b6472" font-family="Arial, Helvetica, sans-serif">Prompt &amp; tools</text>
<text x="790" y="238" font-size="11.5" fill="#5b6472" font-family="Arial, Helvetica, sans-serif">Completion</text>
<circle r="3" fill="#c07f11" opacity="0.9"><animateMotion dur="2s" repeatCount="indefinite" path="M770,250 L770,200"/></circle>
<circle r="3" fill="#8a8d93" opacity="0.9"><animateMotion dur="2s" begin="1s" repeatCount="indefinite" path="M770,200 L770,250"/></circle>

