<text x="366" y="340" font-size="11.5" fill="#2f6455">â€¢ POST /register, /login</text>
<text x="366" y="362" font-size="11.5" fill="#2f6455">â€¢ POST /chat (JWT-protected)</text>
<text x="366" y="384" font-size="11.5" fill="#2f6455">â€¢ Password hashing (bcrypt)</text>
<text x="366" y="406" font-size="11.5" fill="#2f6455">â€¢ CORS-enabled REST interface</text>
</g>

<!-- Agent Orchestrator (core) -->
<g font-family="Arial, Helvetica, sans-serif">
<rect x="660" y="250" width="220" height="210" rx="12" fill="#fdf1e0" stroke="#c07f11" stroke-width="2">
